apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  annotations:
    # cert-manager が、下の https の待ち受け用の証明書を、この発行元から取得する
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: raspi-growi.duckdns.org
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: raspi-growi-tls
      allowedRoutes:
        namespaces:
          from: All
