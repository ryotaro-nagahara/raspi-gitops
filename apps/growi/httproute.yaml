# 家の中用。raspi.local に HTTP で来た通信を GROWI に渡す
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: growi
  namespace: growi
spec:
  # 接続する入口。sectionName で、Gateway の http（80番）の待ち受けだけに接続する
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: gateway
      sectionName: http
  # この経路が受け付けるホスト名。ここに無い名前やIPアドレスで来た通信は対象外
  hostnames:
    - raspi.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # 転送先
      backendRefs:
        - group: ""
          kind: Service
          name: growi
          namespace: growi
          port: 3000
          weight: 1
---
# 公開用。raspi-growi.duckdns.org に HTTPS で来た通信を GROWI に渡す
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: growi-public
  namespace: growi
spec:
  # 接続する入口。Gateway の https（443番）の待ち受けだけに接続する
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: gateway
      sectionName: https
  hostnames:
    - raspi-growi.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # 転送先
      backendRefs:
        - group: ""
          kind: Service
          name: growi
          namespace: growi
          port: 3000
          weight: 1
---
# 公開用の名前に HTTP で来た通信を、HTTPS の同じURLへ移動させる
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: growi-public-redirect
  namespace: growi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: gateway
      sectionName: http
  hostnames:
    - raspi-growi.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # 転送先は無い。移動の指示（301）だけを返す
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
