apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: growi
  namespace: growi
spec:
  # 接続する入口
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: gateway
  # この経路が受け付けるホスト名。ここに無い名前やIPアドレスで来た通信は対象外
  hostnames:
    - raspi.local
    - raspi-growi.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # 転送先
      backendRefs:
        - group: ""
          kind: Service
          name: growi
          namespace: growi
          port: 3000
          weight: 1
