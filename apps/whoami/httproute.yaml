apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  # 接続する入口
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: gateway
  # hostnames は書いていない。書かない場合は、すべてのホスト名が対象になる
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /whoami
      # 転送先
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          namespace: whoami
          port: 80
          weight: 1
