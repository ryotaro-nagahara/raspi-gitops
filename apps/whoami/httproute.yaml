apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  # 接続する入口。sectionName で、Gateway の http（80番）の待ち受けだけに接続する
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: gateway
      sectionName: http
  # この経路が受け付けるホスト名。家の中でしか通用しない名前だけにして、外には出さない
  hostnames:
    - raspi.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /whoami
      # 転送先
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          namespace: whoami
          port: 80
          weight: 1
