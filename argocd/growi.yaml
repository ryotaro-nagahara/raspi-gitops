apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: growi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ryotaro-nagahara/raspi-gitops.git
    targetRevision: main
    path: apps/growi
  destination:
    server: https://kubernetes.default.svc
    namespace: growi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
