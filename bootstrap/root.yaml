apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ryotaro-nagahara/raspi-gitops.git
    targetRevision: main
    # このフォルダにある Application の定義を、クラスタに登録する
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Git からファイルを消しても、登録済みの Application は自動では削除しない
      prune: false
      selfHeal: true
